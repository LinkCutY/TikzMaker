<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Grid 实验：三个盒子</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #14161a;
      color: #e8eaed;
      font-family: system-ui, sans-serif;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    /* 大盒子：格子架 */
    #shelf {
      display: grid;                      /* 变成格子架 */
      grid-template-columns: 1fr 1fr 1fr; /* 横着切三列，每列一份 */
      gap: 12px;                          /* 格子之间留 12px 缝 */
    }

    /* 小盒子：外观 */
    .box {
      padding: 40px;
      background: #2b3140;
      border: 1px solid #3a4352;
      border-radius: 8px;
      text-align: center;
      font-size: 32px;
    }
  </style>
</head>
<body>
  <h1>三个盒子</h1>

  <div id="shelf">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>
</body>
</html>
