<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Tikz studio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            padding: 24px;
            background: #14161a;
            color: #e8eaed;
            font-family: system-ui, sans-serif;
        }
        .app {
            height: 100vh;
            display: grid;
            grid-template-rows: 48px 1fr 28px;
        }
        .topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            background: #181b21;
            border-bottom: 1px solid #2a2f3a;
        }
        .topbar h1 {
            margin: 0;
            font-size: 15px;
        }
        .spacer {
            flex: 1;
        }
        button {
            font: inherit;
            font-size: 12px;
            color: #e8eaed;
            background: #232833;
            border: 1px solid #333a45;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
        }
        button:hover {
            background: #2b3140;
        }
        .workbench {
            display: grid;
            grid-template-columns: minmax(280px, 42%) 1fr;
            min-height: 0;
        }
        .pane {
            display: flex;
            
        }
        h1 { font-size: 22px; }
        p { color: #9aa4b2; }
        canvas {
            display: block;
            margin-top: 16px;
            background: #1b1e24;
            border: 1px solid #333a45;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Tikz Studio</h1>
    <canvas id = "stage" width = "720" height = "420"></canvas>
    <script>
        console.log("页面加载完成");
    </script>
</body>
</html>
