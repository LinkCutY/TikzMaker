<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Test for grid</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #14161a;
            color: #e8eaed;
            font-family: system-ui, sans-serif;
        }

        #shelf {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .box {
            padding: 40px;
            background: #2b3140;
            border: 1px solid #3a4352;
            border-radius: 4px;
            text-align: center;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div id="shelf">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
